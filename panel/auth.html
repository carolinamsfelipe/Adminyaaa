<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AdminYAAA — Acceso Seguro al Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0f172a', 800: '#1e293b', 700: '#334155' },
            accent: { DEFAULT: '#10B981', dark: '#059669', light: '#d1fae5' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .ay-input {
      @apply w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition;
    }
    .login-card {
      backdrop-filter: blur(12px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.35s ease-out both; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">

  <!-- Background decorative elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-emerald-500 rounded-full opacity-5 blur-3xl"></div>
    <div class="absolute -bottom-32 -left-16 w-80 h-80 bg-blue-500 rounded-full opacity-5 blur-3xl"></div>
  </div>

  <div class="w-full max-w-md animate-slide-up">

    <!-- Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 mb-2">
        <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
          </svg>
        </div>
        <span class="text-2xl font-extrabold text-white tracking-tight">Admin<span class="text-emerald-400">YAAA</span></span>
      </div>
      <p class="text-slate-400 text-xs font-medium">Gestión Administrativa PyME &middot; Distribución Mayorista</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 login-card border border-slate-100">
      <div class="flex items-center justify-between mb-5">
        <div>
          <h1 class="text-lg font-bold text-slate-900">Iniciar sesión</h1>
          <p class="text-slate-500 text-xs">Acceso por roles con seguridad RLS</p>
        </div>
        <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600">Sistema v2.4</span>
      </div>

      <form id="login-form" novalidate>
        <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <span id="login-error-text">Usuario o contraseña incorrectos.</span>
        </div>

        <div class="space-y-3.5">
          <div>
            <label for="login-email" class="block text-xs font-medium text-slate-700 mb-1">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
              placeholder="tu-correo@adminyaaa.com"
              autocomplete="email"
              required
            >
          </div>
          <div>
            <label for="login-password" class="block text-xs font-medium text-slate-700 mb-1">Contraseña</label>
            <div class="relative">
              <input
                type="password"
                id="login-password"
                name="password"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition pr-10"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="mt-5 w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-sm"
        >
          <span id="login-btn-text">Ingresar al sistema</span>
          <svg id="login-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <!-- SELECCIÓN RÁPIDA DE ROLES DEMO -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-[11px] text-slate-400 text-center mb-2.5 uppercase tracking-wider font-semibold">Accesos Rápidos por Rol</p>
        <div class="grid grid-cols-1 gap-2">
          <!-- Ralukita (Admin Principal) -->
          <button
            onclick="quickLogin('ralukita101@gmail.com', 'ralukita2026!')"
            class="flex items-center justify-between p-2.5 border border-emerald-200 bg-emerald-50/50 rounded-lg hover:bg-emerald-100/60 transition text-left"
          >
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold flex-shrink-0">👑</div>
              <div>
                <div class="text-xs font-bold text-slate-900">Carolina (Ralukita)</div>
                <div class="text-[10px] text-emerald-700 font-medium">SuperAdmin &middot; Bóveda &middot; Finanzas</div>
              </div>
            </div>
            <span class="text-[10px] font-bold text-emerald-800 font-mono bg-white px-2 py-0.5 rounded border border-emerald-200">Acceso Total</span>
          </button>

          <!-- Máximo (Operador) -->
          <button
            onclick="quickLogin('maximo@adminyaaa.com', 'oper123')"
            class="flex items-center justify-between p-2.5 border border-slate-200 rounded-lg hover:border-blue-300 hover:bg-blue-50/50 transition text-left"
          >
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0">MF</div>
              <div>
                <div class="text-xs font-semibold text-slate-800">Máximo Ferreyra</div>
                <div class="text-[10px] text-blue-600 font-medium">Operador &middot; Tareas &middot; Mayorista</div>
              </div>
            </div>
            <span class="text-[10px] font-medium text-blue-700 bg-blue-50 px-2 py-0.5 rounded">Operador</span>
          </button>

          <!-- Cliente (Hugo Robles / Parrilla Los Robles) -->
          <button
            onclick="quickLogin('cliente@losrobles.com.ar', 'cliente123')"
            class="flex items-center justify-between p-2.5 border border-amber-200 bg-amber-50/40 rounded-lg hover:bg-amber-100/60 transition text-left"
          >
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-bold flex-shrink-0">🏢</div>
              <div>
                <div class="text-xs font-bold text-slate-900">Parrilla Los Robles (Hugo)</div>
                <div class="text-[10px] text-amber-700 font-medium">Portal Cliente &middot; Cta Cte &middot; Buzón</div>
              </div>
            </div>
            <span class="text-[10px] font-bold text-amber-800 font-mono bg-white px-2 py-0.5 rounded border border-amber-200">Portal Cliente</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-500 text-[11px] mt-6">
      AdminYAAA &copy; 2026 &mdash; Plataforma Integral de Servicios Administrativos y Mayorista
    </p>
  </div>

  <script type="module">
    import { Auth } from './assets/js/core/auth.js'
    import { initStorage } from './assets/js/data/api.js'

    initStorage()

    const session = Auth.getSession()
    if (session) {
      window.location.href = 'index.html'
    }

    const form = document.getElementById('login-form')
    const emailInput = document.getElementById('login-email')
    const passwordInput = document.getElementById('login-password')
    const loginBtn = document.getElementById('login-btn')
    const loginBtnText = document.getElementById('login-btn-text')
    const loginSpinner = document.getElementById('login-spinner')
    const loginError = document.getElementById('login-error')
    const loginErrorText = document.getElementById('login-error-text')
    const togglePassword = document.getElementById('toggle-password')

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password'
      passwordInput.type = isPassword ? 'text' : 'password'
    })

    function setLoading(loading) {
      loginBtn.disabled = loading
      loginBtnText.textContent = loading ? 'Validando credenciales...' : 'Ingresar al sistema'
      loginSpinner.classList.toggle('hidden', !loading)
    }

    function showError(msg) {
      loginErrorText.textContent = msg
      loginError.classList.remove('hidden')
      emailInput.classList.add('border-red-300')
      passwordInput.classList.add('border-red-300')
    }

    function hideError() {
      loginError.classList.add('hidden')
      emailInput.classList.remove('border-red-300')
      passwordInput.classList.remove('border-red-300')
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      hideError()
      const email = emailInput.value.trim()
      const password = passwordInput.value
      if (!email || !password) {
        showError('Por favor completá tu correo y contraseña.')
        return
      }
      setLoading(true)
      try {
        await Auth.login(email, password)
        window.location.href = 'index.html'
      } catch (err) {
        showError(err.message || 'Usuario o contraseña incorrectos.')
        setLoading(false)
        passwordInput.value = ''
        passwordInput.focus()
      }
    })

    window.quickLogin = async (email, password) => {
      emailInput.value = email
      passwordInput.value = password
      hideError()
      setLoading(true)
      try {
        await Auth.login(email, password)
        window.location.href = 'index.html'
      } catch (err) {
        showError(err.message)
        setLoading(false)
      }
    }
  </script>
</body>
</html>
