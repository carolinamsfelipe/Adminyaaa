<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AdminYAAA — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0f172a', 800: '#1e293b', 700: '#334155' },
            accent: { DEFAULT: '#10B981', dark: '#059669', light: '#d1fae5' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .ay-input {
      @apply w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition;
    }
    .login-card {
      backdrop-filter: blur(10px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.4s ease-out both; }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; }
    }
    .bg-pulse { animation: pulse-slow 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">

  <!-- Background decorative circles -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-emerald-500 rounded-full opacity-5 bg-pulse"></div>
    <div class="absolute -bottom-32 -left-16 w-72 h-72 bg-emerald-400 rounded-full opacity-5 bg-pulse" style="animation-delay:1.5s"></div>
    <div class="absolute top-1/2 left-1/3 w-48 h-48 bg-slate-700 rounded-full opacity-20 bg-pulse" style="animation-delay:0.8s"></div>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-sm animate-slide-up">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-3">
        <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
          </svg>
        </div>
        <span class="text-2xl font-bold text-white tracking-tight">Admin<span class="text-emerald-400">YAAA</span></span>
      </div>
      <p class="text-slate-400 text-sm">Panel de gestión interna</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 login-card">
      <h1 class="text-lg font-semibold text-slate-900 mb-1">Iniciar sesión</h1>
      <p class="text-slate-500 text-sm mb-6">Ingresá con tu cuenta de equipo</p>

      <form id="login-form" novalidate>
        <!-- Error message -->
        <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <span id="login-error-text">Usuario o contraseña incorrectos.</span>
        </div>

        <div class="space-y-4">
          <div>
            <label for="login-email" class="block text-xs font-medium text-slate-700 mb-1.5">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
              placeholder="tucorreo@adminyaaa.com"
              autocomplete="email"
              required
            >
          </div>
          <div>
            <label for="login-password" class="block text-xs font-medium text-slate-700 mb-1.5">Contraseña</label>
            <div class="relative">
              <input
                type="password"
                id="login-password"
                name="password"
                class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition pr-10"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
                <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="mt-6 w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span id="login-btn-text">Ingresar al panel</span>
          <svg id="login-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <!-- Demo quick access -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-xs text-slate-400 text-center mb-3 uppercase tracking-wide font-medium">Acceso rápido (demo)</p>
        <div class="grid grid-cols-2 gap-2">
          <button
            onclick="quickLogin('joaquin@adminyaaa.com', 'admin123')"
            class="flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg hover:border-emerald-300 hover:bg-emerald-50 transition text-left"
          >
            <div class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold flex-shrink-0">JI</div>
            <div>
              <div class="text-xs font-semibold text-slate-800">Joaquín</div>
              <div class="text-[10px] text-emerald-600 font-medium">Administrador</div>
            </div>
          </button>
          <button
            onclick="quickLogin('maximo@adminyaaa.com', 'oper123')"
            class="flex items-center gap-2 p-2.5 border border-slate-200 rounded-lg hover:border-blue-300 hover:bg-blue-50 transition text-left"
          >
            <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0">MF</div>
            <div>
              <div class="text-xs font-semibold text-slate-800">Máximo</div>
              <div class="text-[10px] text-blue-600 font-medium">Operador</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-500 text-xs mt-6">
      AdminYAAA &copy; 2026 &mdash; Gestión Empresarial PyMEs
    </p>
  </div>

  <script type="module">
    import { Auth } from './assets/js/core/auth.js'
    import { initStorage } from './assets/js/data/api.js'

    // Initialize data storage on first load
    initStorage()

    // Check if already logged in
    const session = Auth.getSession()
    if (session) {
      window.location.href = 'index.html'
    }

    const form = document.getElementById('login-form')
    const emailInput = document.getElementById('login-email')
    const passwordInput = document.getElementById('login-password')
    const loginBtn = document.getElementById('login-btn')
    const loginBtnText = document.getElementById('login-btn-text')
    const loginSpinner = document.getElementById('login-spinner')
    const loginError = document.getElementById('login-error')
    const loginErrorText = document.getElementById('login-error-text')
    const togglePassword = document.getElementById('toggle-password')

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password'
      passwordInput.type = isPassword ? 'text' : 'password'
      document.getElementById('eye-icon').innerHTML = isPassword
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`
    })

    function setLoading(loading) {
      loginBtn.disabled = loading
      loginBtnText.textContent = loading ? 'Ingresando...' : 'Ingresar al panel'
      loginSpinner.classList.toggle('hidden', !loading)
    }

    function showError(msg) {
      loginErrorText.textContent = msg
      loginError.classList.remove('hidden')
      emailInput.classList.add('border-red-300')
      passwordInput.classList.add('border-red-300')
    }

    function hideError() {
      loginError.classList.add('hidden')
      emailInput.classList.remove('border-red-300')
      passwordInput.classList.remove('border-red-300')
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      hideError()
      const email = emailInput.value.trim()
      const password = passwordInput.value
      if (!email || !password) {
        showError('Completá el correo y la contraseña.')
        return
      }
      setLoading(true)
      try {
        await Auth.login(email, password)
        window.location.href = 'index.html'
      } catch (err) {
        showError(err.message || 'Usuario o contraseña incorrectos.')
        setLoading(false)
        passwordInput.value = ''
        passwordInput.focus()
      }
    })

    // Clear error on input
    emailInput.addEventListener('input', hideError)
    passwordInput.addEventListener('input', hideError)

    // Focus email on load
    emailInput.focus()

    // Quick login helper (exposed globally for the buttons)
    window.quickLogin = async (email, password) => {
      emailInput.value = email
      passwordInput.value = password
      hideError()
      setLoading(true)
      try {
        await Auth.login(email, password)
        window.location.href = 'index.html'
      } catch (err) {
        showError(err.message)
        setLoading(false)
      }
    }
  </script>
</body>
</html>
